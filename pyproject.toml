[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "rang-core"
version = "0.1.0"
description = "MeerKAT calibration research on one Rust core (import rang)"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "Gijs Molenaar"}]
keywords = ["radio astronomy", "MeerKAT", "calibration", "flagging", "interferometry", "imaging", "measurement set"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Astronomy",
]
# rang.core and every wrapper import NumPy; the extension itself does not
# need it at import time, so a bare wheel install would otherwise half work.
dependencies = ["numpy>=1.26"]

[project.urls]
Documentation = "https://gijzelaerr.github.io/rang-core/"
Repository = "https://github.com/gijzelaerr/rang-core"
Issues = "https://github.com/gijzelaerr/rang-core/issues"
Changelog = "https://github.com/gijzelaerr/rang-core/blob/main/CHANGELOG.md"

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
test = ["pytest>=8"]
pointing = ["jax>=0.4.30", "scipy>=1.12"]
beam = ["katbeam==0.1", "eidos==1.1.2"]
# No `flagging` extra since W4-5 (research/w4-5-release.md): it pinned the
# frozen QuartiCal 0.2.7 / Stimela 2.1.4 / python-casacore 3.8.1 stack that
# only history/ used; history/tools/flagging/requirements.lock keeps the pins.
recipes = ["stimela==2.1.4"]
imaging = ["astropy>=6"]
# MeerKAT MVFv4 archives through katdal (research/mk1-katdal.md); python-lzf and
# rdbtools are sdist-only (a C compiler is needed), cityhash has no cp314 wheel.
meerkat = ["katdal==0.23", "katsdptelstate[rdb]==1.0.0"]
# DF-IO (research/dfio-formats.md): the H5parm reader and writer.
formats = ["h5py>=3.11"]
# casacure as the second, read-only oracle of the core's table reader and
# writer on every OS (research/t1-casacure-ci.md); pinned exactly. The marker
# lists the platforms 3.8.35 has wheels for (none for macOS x86_64 or macOS
# arm64 cp310), so the sdist, which needs Rust and a C compiler, is never built.
casacure = ["casacure==3.8.35; (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'darwin' and platform_machine == 'arm64' and python_version >= '3.11')"]
# CARTA from the notebooks (research/nb-carta.md): the PyPI dependencies of
# CARTA's wrapper and of rang.notebook.carta. The wrapper itself (carta-python,
# GPL-3.0) has no PyPI release and PyPI refuses direct references, so install it
# by commit: pip install 'carta @ git+https://github.com/CARTAvis/carta-python@989af8ed97238931abe5f235add37e0813bf7e0b'
# (the PyPI package `carta` is unrelated). The backend runs in a pinned container.
carta = ["astropy>=6", "requests>=2.31", "simplejson>=3.19", "selenium>=4.40"]
notebook = ["matplotlib>=3.8", "pandas>=2.1", "ipywidgets>=8.1", "ipykernel>=6.29", "jupyterlab>=4", "nbformat>=5.9", "nbconvert>=7.16"]
# The documentation site (research/d1-docs.md): Sphinx with MyST notebooks, executed by papermill.
docs = ["sphinx>=9.2", "furo>=2025.12", "myst-nb>=1.4", "papermill>=2.7"]

[project.scripts]
rang-core = "rang.core_cli:main"

[tool.maturin]
# The PyO3 extension rang._core (research/core-j-packaging.md) is built
# from the thin crate core/py; the Python package stays in python/rang.
python-source = "python"
manifest-path = "core/py/Cargo.toml"
module-name = "rang._core"
# The sdist holds what builds the wheel and what tests the installed wheel
# (research/w4-5-release.md): the three crates, python/, tests/ (the wheel
# subset of tools/wheel/pytest_wheel.py runs from it; the full suite reads
# research/ and needs a checkout), tools/wheel/, README, CHANGELOG and LICENSE.
# The root crate rang-toy is a path dependency at the repository root, so
# without this list cargo's file list puts the whole tree in the sdist.
# .cargo/config.toml (x86-64-v3 for local builds) stays out: an sdist build
# targets the builder's baseline CPU.
exclude = [
    { path = ".cargo/**/*", format = "sdist" },
    { path = ".github/**/*", format = "sdist" },
    { path = "core/examples/**/*", format = "sdist" },
    { path = "data/**/*", format = "sdist" },
    { path = "docs/**/*", format = "sdist" },
    { path = "examples/**/*", format = "sdist" },
    { path = "formal/**/*", format = "sdist" },
    { path = "history/**/*", format = "sdist" },
    { path = "notebooks/**/*", format = "sdist" },
    { path = "outputs/**/*", format = "sdist" },
    { path = "recipes/**/*", format = "sdist" },
    { path = "research/**/*", format = "sdist" },
    { path = "tools/check-all.sh", format = "sdist" },
    { path = "tools/core-j-suite.sh", format = "sdist" },
    { path = "tools/formats-oracle/**/*", format = "sdist" },
    { path = "tools/ms-reader/**/*", format = "sdist" },
    { path = "tools/oracles/**/*", format = "sdist" },
    { path = "AGENTS.md", format = "sdist" },
    { path = "CONTRIBUTING.md", format = "sdist" },
    { path = ".gitignore", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]

[tool.ruff]
# history/ holds frozen files that campaign receipts hash (research/p8-history.md):
# never lint or reformat them.
extend-exclude = ["history"]
