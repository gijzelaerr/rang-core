[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "rangtoy"
version = "0.1.0"
description = "Python orchestration for the Rang MeerKAT calibration toy"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "Gijs Molenaar"}]
keywords = ["radio astronomy", "MeerKAT", "calibration", "flagging", "interferometry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Astronomy",
]
# rangtoy.core and every wrapper import NumPy; the extension itself does not
# need it at import time, so a bare wheel install would otherwise half work.
dependencies = ["numpy>=1.26"]

[project.urls]
Repository = "https://github.com/gijzelaerr/rang"

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
test = ["pytest>=8"]
pointing = ["jax>=0.4.30", "numpy>=1.26", "scipy>=1.12"]
beam = ["katbeam==0.1"]
flagging = ["quartical==0.2.7", "stimela==2.1.4", "python-casacore==3.8.1", "numpy>=1.26", "matplotlib>=3.8"]
recipes = ["stimela==2.1.4"]
imaging = ["astropy>=6"]
notebook = ["matplotlib>=3.8", "pandas>=2.1", "ipywidgets>=8.1", "ipykernel>=6.29", "jupyterlab>=4", "nbformat>=5.9", "nbconvert>=7.16"]

[project.scripts]
rang-core = "rangtoy.core_cli:main"

[tool.maturin]
# The PyO3 extension rangtoy._core (research/core-j-packaging.md) is built
# from the thin crate core/py; the Python package stays in python/rangtoy.
python-source = "python"
manifest-path = "core/py/Cargo.toml"
module-name = "rangtoy._core"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]

[tool.ruff]
# history/ holds frozen files that campaign receipts hash (research/p8-history.md):
# never lint or reformat them.
extend-exclude = ["history"]
