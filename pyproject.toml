[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rangtoy"
version = "0.1.0"
description = "Python orchestration for the Rang MeerKAT calibration toy"
requires-python = ">=3.10"

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
test = ["pytest>=8"]
pointing = ["jax>=0.4.30", "numpy>=1.26", "scipy>=1.12"]
beam = ["katbeam==0.1"]
flagging = ["quartical==0.2.7", "stimela==2.1.4", "python-casacore==3.8.1", "numpy>=1.26", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
