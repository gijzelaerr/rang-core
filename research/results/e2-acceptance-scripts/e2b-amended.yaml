# E2-B amended arm (e2-acceptance.md 6.7, amendment 2026-11-12): e2b.yaml plus
# calibrate.average_freq: true, nothing else changed.
# E2-B of research/a0-acceptance.md (6.3; CARACal's
# meerkat-fullStokes-continuum-defaults.yml, 6.4; amendment 1), frozen in
# research/e2-acceptance.md part 2 before any E2-B visibility was read. LUNO
# scans 17 to 20, full polarisation, calibrators only. From
# tests/data/w2/e2b.yaml with: the 3C 286 model named (CARACal's NRAO manual
# model, amendment 1 item 2); images clean to 3 sigma with mgain 0.9 (CARACal's
# img_mgain) and no automatic mask: rang refuses a mask on joined IQUV images
# (G4), so A0 rule 6's 5-sigma mask is a deviation here, the same in the oracle
# arm; image.niter the new default 1e6. refant auto, as CARACal's shipped E3-B value.
# Time pre-averaging (owner item 33(3); e2-acceptance.md 6.1): calibrate.average_time
# on, CASA-style, because CARACal's solints need 145-176 GiB at 4,096 channels
# without it.
schema: rang-config
version: 1
fields:
  fcal: [J1939-6342]
  bpcal: [J1939-6342]
  gcal: [J1833-2103]
  xcal: [J1331+3030]
data:
  weights: uniform
  scans: [17, 18, 19, 20]
flag:
  strategy: mk_rfi_flagging_calibrator_fields_firstpass.yaml
calibrate:
  model: {source: setjy, standard: Stevens-Reynolds 2016}
  refant: auto
  uvrange: ">150"
  average_time: true
  average_freq: true
  primary:
    field: [fcal]
    terms:
      - {type: K, name: K, solint: inf}
      - {type: G, name: G, solint: inf, calmode: ap, preapply: [K], interp: [linear]}
      - {type: B, name: B, solint: inf, preapply: [K, G], interp: [linear, linear]}
  secondary:
    field: [gcal]
    # GAF with KB applied; F is solved on a copy of the primary G, then fluxscale.
    terms:
      - {type: G, name: Gsec, solint: inf, calmode: ap, preapply: [K, B],
         interp: [linear, linear]}
      - {type: A, name: Asec}
      - {type: F, name: F, solint: inf, calmode: ap, smodel: [1, 0, 0, 0],
         preapply: [K, B], interp: [linear, linear]}
  polcal:
    field: [xcal]
    model: {source: nrao, name: 3C286}
    feed_angle_rotation: -90
    extendflags: true
    # Strategy 1 (xcal_model_fcal_leak); Gpol is phase-only (amendment 1).
    terms:
      - {type: Gpol, name: Gpol, solint: 60s, calmode: p, parang: true,
         preapply: [K, G, B], interp: [linear, linear, linear]}
      - {type: KCROSS, name: Kcross, solint: inf, parang: true,
         preapply: [K, G, B, Gpol], interp: [linear, linear, linear, linear]}
      - {type: Xf, name: Xf, solint: inf, combine: scan, parang: true,
         preapply: [K, G, B, Gpol, Kcross], interp: [linear, linear, linear, linear, nearest]}
      - {type: Df, name: Df, field: [fcal], solint: inf, combine: scan, parang: true,
         clip: [-0.6, 0.6], preapply: [K, G, B, Kcross, Xf],
         interp: [linear, linear, linear, nearest, nearest]}
apply:
  calwt: false
  parang: true
  targets:
    - field: [gcal]
      tables: [K, F, B, Kcross, Xf, Df]
      gainfield: [J1939-6342, J1833-2103, J1939-6342, "", "", ""]
      interp: [linear, linear, linear, nearest, nearest, nearest]
    - field: [fcal, xcal]
      tables: [K, G, B, Gpol, Kcross, Xf, Df]
      interp: [linear, linear, linear, linear, nearest, nearest, nearest]
image:
  fields: [fcal, gcal, xcal]
  column: CORRECTED_DATA
  size: [2048, 2048]
  scale: 2asec
  weight: briggs
  robust: 0.0
  channels_out: 8
  join_channels: true
  pol: IQUV
  join_polarizations: true
  mgain: 0.9
  auto_threshold: 3.0
run:
  stages: [flag, calibrate, apply, image]
