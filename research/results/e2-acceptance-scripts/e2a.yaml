# E2-A of research/a0-acceptance.md (6.3; CARACal's meerkat-defaults.yml, 6.4),
# frozen in research/e2-acceptance.md part 2 before any E2-A visibility was read.
# ESO137 ms1: primary scans 9 and 11 (J1939-6342) around target scan 10
# (ESO137-001), Stokes I. From tests/data/w2/e2a.yaml with: the target's real
# name; refant auto (the default since E2, finish-plan item 27); A0 rule 6 for
# every image (automatic mask 5 sigma, clean to 3 sigma; mgain 0.9, CARACal's
# img_mgain, which the mask needs); multiscale (gated, item 29); CARACal's
# selfcal values for the C5b keys (item 29: cleanmask wsclean at 10 then 6
# sigma, clean_cutoff 0.5); image.niter the new default 1e6.
# Time pre-averaging (owner item 33(3); e2-acceptance.md 6.1): calibrate.average_time
# and selfcal.average_time on, CASA-style, because CARACal's solints need
# 145-333 GiB at 4,096 channels without it.
schema: rang-config
version: 1
fields:
  fcal: [J1939-6342]
  bpcal: [J1939-6342]
  gcal: [J1939-6342]
  target: [ESO137-001]
data:
  weights: uniform
  scans: [9, 10, 11]
flag:
  strategy: mk_rfi_flagging_calibrator_fields_firstpass.yaml
  fields: [fcal, target]
calibrate:
  model: {source: setjy, standard: Stevens-Reynolds 2016}
  refant: auto
  uvrange: ">150"
  average_time: true
  primary:
    field: [fcal]
    # KGBAKGB, solints inf, inf, inf, -, 60s, 60s, inf; B combines scans.
    terms:
      - {type: K, name: K0, solint: inf}
      - {type: G, name: G0, solint: inf, calmode: ap, preapply: [K0], interp: [linear]}
      - {type: B, name: B0, solint: inf, combine: scan, fillgaps: 70, solnorm: false,
         preapply: [K0, G0], interp: [linear, linear]}
      - {type: A, name: A0, strategy: mk_rfi_flagging_calibrator_fields_firstpass.yaml}
      - {type: K, name: K1, solint: 60s, preapply: [G0, B0], interp: [linear, linear]}
      - {type: G, name: G1, solint: 60s, calmode: ap, preapply: [K1, B0],
         interp: [linear, linear]}
      - {type: B, name: B1, solint: inf, combine: scan, fillgaps: 70, solnorm: false,
         preapply: [K1, G1], interp: [linear, linear]}
apply:
  calwt: false
  targets:
    - field: [fcal, target]
      tables: [K1, G1, B1]
      gainfield: [nearest, nearest, J1939-6342]
      interp: [linear, linear, linear]
image:
  fields: [target]
  column: CORRECTED_DATA
  size: [4096, 4096]
  scale: 3asec
  weight: briggs
  robust: 0.5
  average_channels: 8
  channels_out: 8
  join_channels: true
  fit_spectral_pol: 2
  mgain: 0.9
  auto_mask: 5.0
  auto_threshold: 3.0
  multiscale: true
selfcal:
  rounds: 2
  average_time: true
  terms: [{type: Sp, solint: 120}, {type: Sa, solint: 120}]
  cleanmask_method: [wsclean]
  cleanmask_thr: [10, 6]
  clean_cutoff: [0.5]
run:
  stages: [flag, calibrate, apply, image, selfcal]
