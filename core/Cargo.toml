[package]
name = "rang-core"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "In-memory visibility model and fused calibration passes for Rang"

[lib]
name = "rang_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "gemclean"
path = "src/bin/gemclean.rs"

[[bin]]
name = "gridder_gram_bench"
path = "src/bin/gridder_gram_bench.rs"

[[bin]]
name = "gram_solver_bench"
path = "src/bin/gram_solver_bench.rs"

[dependencies]
rang-sim = { path = ".." }
rayon = "1.12.0"
rustfft = "6.4.1"
# The GPU gridder (task X2, research/x2-wgpu.md), behind the feature `gpu`.
wgpu = { version = "=30.0.1", optional = true, default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "dx12", "wgsl"] }
pollster = { version = "=0.4.0", optional = true }

[features]
gpu = ["dep:wgpu", "dep:pollster"]

[profile.release]
lto = "thin"
codegen-units = 1

# The gemclean binary for measurement: cargo build --profile gemclean --bin gemclean
# (research/gemclean.md §5, 5.9 % fewer instructions than thin LTO).
[profile.gemclean]
inherits = "release"
lto = "fat"
