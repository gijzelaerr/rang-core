[package]
name = "rang-core-py"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "PyO3 extension module rang._core over the Rang core"

[lib]
name = "rang_core_py"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rang-core = { path = ".." }
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py310"] }
numpy = "0.30.0"

[features]
# The wgpu gridder of the core (task X2, research/x2-wgpu.md).
gpu = ["rang-core/gpu"]

[profile.release]
lto = "thin"
codegen-units = 1
