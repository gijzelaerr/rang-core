# DL1's burn arm (research/dl1-contract.md, section 7): burn-onnx turns the
# ONNX file into Rust code and a .bpk weights file at build time (G1), so it
# is its own crate. DL1_ONNX names the file at build time.
[package]
name = "dl1-burn"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "dl1_burn"
path = "src/lib.rs"

[dependencies]
burn = { version = "=0.22.0", default-features = false, features = ["std", "flex"] }
burn-store = "=0.22.0"
rayon = "1.12.0"

[build-dependencies]
burn-onnx = "=0.22.0"
