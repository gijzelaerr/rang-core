  G.tilt.instanceColor.needsUpdate=G.az.instanceColor.needsUpdate=G.ped.instanceColor.needsUpdate=true;mc.needsUpdate=true;setWeb();}
function setWeb(){var a=G.webGeo.attributes.position.array,n=0;for(var p=0;p<NB;p++){if(PJ_[p]>=S.nAnt)continue;var i=PI_[p],j=PJ_[p];a[n++]=hubPos[i].x;a[n++]=HUB;a[n++]=hubPos[i].z;a[n++]=hubPos[j].x;a[n++]=HUB;a[n++]=hubPos[j].z;}
  G.webGeo.setDrawRange(0,n/3);G.webGeo.attributes.position.needsUpdate=true;}
window.__active=function(){if(ok)setActive();};
var Yv=T?new T.Vector3(0,1,0):null;
function setTube(m,a,b,r){var d=tv.copy(b).sub(a),L=d.length();if(L<1e-3){m.visible=false;return;}m.visible=true;m.position.copy(a).addScaledVector(d,.5);m.scale.set(r,L,r);m.quaternion.setFromUnitVectors(Yv,d.normalize());}
function place(el,v,txtc,show){if(!show){el.style.display='none';return;}tv.copy(v).project(camera);if(tv.z>1||tv.z<-1){el.style.display='none';return;}
  el.style.display='';el.style.transform='translate(-50%,-50%) translate('+((tv.x+1)/2*stage.clientWidth).toFixed(1)+'px,'+((1-tv.y)/2*stage.clientHeight).toFixed(1)+'px)';if(el.textContent!==txtc)el.textContent=txtc;}
function shot(){
  if(!ok)return;var s=srcENU(S.ch<=5?H0:(S.ch===6?-S.track/2:S.track/2),S.dec),sv=V(s[0],s[1],s[2]),pos,tgt,c=S.ch;
  var sh=new T.Vector3(sv.x,0,sv.z);if(sh.length()<.05)sh.set(0,0,-1);sh.normalize();
  if(c===0){pos=new T.Vector3(dishPos[0].x-52,15,dishPos[0].z+66);tgt=new T.Vector3(dishPos[0].x,12,dishPos[0].z);}
  else if(c<=3){var a=hubPos[S.pair[0]],b=hubPos[S.pair[1]],mid=a.clone().add(b).multiplyScalar(.5),bd=b.clone().sub(a);bd.y=0;var B=bd.length();bd.normalize();
    var perp=new T.Vector3(-bd.z,0,bd.x);if(perp.dot(sh)>0)perp.negate();
    var wide=camera.aspect>1.3?2.0:1.25;pos=mid.clone().addScaledVector(perp,B*wide+110).add(new T.Vector3(0,B*.3+30,0));tgt=mid.clone().add(new T.Vector3(0,B*.22+14,0));}
  else if(c===5){pos=new T.Vector3(-2400,3000,6200);tgt=new T.Vector3(0,0,-300);}
  else if(c===6){pos=new T.Vector3(500,420,6800);tgt=new T.Vector3(0,1250,0);}
  else{pos=sh.clone().multiplyScalar(-760).add(new T.Vector3(0,34,0));tgt=sv.clone().multiplyScalar(215);}
  if(reduced){camera.position.copy(pos);controls.target.copy(tgt);G.tween=null;}
  else G.tween={p0:camera.position.clone(),t0:controls.target.clone(),p1:pos,t1:tgt,t:0};
}
window.__shot=shot;
var qd=T?new T.Quaternion():null,ed=T?new T.Euler():null,one=T?new T.Vector3(1,1,1):null,m4=T?new T.Matrix4():null,frontPhase=0;
function update3D(dt,time){
  var s=srcENU(S.Hcur,S.decCur),sv=V(s[0],s[1],s[2]),i,c=S.ch;
  // dishes follow the source
  var el=Math.max(ELMIN,Math.asin(clamp(sv.y,-1,1))),az=Math.atan2(sv.x,sv.z);ed.set(-el,az,0,'YXZ');qd.setFromEuler(ed);
  for(i=0;i<NA;i++){m4.compose(hubPos[i],qd,one);G.tilt.setMatrixAt(i,m4);}G.tilt.instanceMatrix.needsUpdate=true;
  ed.set(0,az,0,'YXZ');qd.setFromEuler(ed);for(i=0;i<NA;i++){m4.compose(hubPos[i],qd,one);G.az.setMatrixAt(i,m4);}G.az.instanceMatrix.needsUpdate=true;
  G.sun.target.position.set(Math.round(controls.target.x/25)*25,0,Math.round(controls.target.z/25)*25);G.sun.position.copy(G.sun.target.position).addScaledVector(G.sunDir,2600);
  G.stars.quaternion.setFromAxisAngle(G.pole,-(S.Hcur-H0)*Math.PI/12);
  G.src.position.copy(sv).multiplyScalar(RS);var sd=camera.position.distanceTo(G.src.position);G.src.scale.setScalar(sd*.09);
  // opacities
  var tg={fronts:c>=1&&c<=3?1:0,pair:c>=1&&c<=4?1:0,web:c===5?.075:c===6?.05:0,patch:(c===4||c>=7)?1:0,arc:c===6?1:0},kf=reduced?1:Math.min(1,dt*4);
  for(var key in tg)G.op[key]+=(tg[key]-G.op[key])*kf;
  var cd=camera.position.distanceTo(controls.target);
  G.markers.material.opacity=clamp((cd-900)/2500,0,1)*.95;
  G.web.material.opacity=G.op.web;G.web.visible=G.op.web>.002;
  // pair
  var A=hubPos[S.pair[0]],Bp=hubPos[S.pair[1]],E=hubPos[P.early],L=hubPos[P.late],w=Math.abs(P.w),mid=A.clone().add(Bp).multiplyScalar(.5),po=G.op.pair,fo=G.op.fronts;
  var rr=Math.max(.28,camera.position.distanceTo(mid)*.0016);
  var end=L.clone().addScaledVector(sv,w);
  setTube(G.tBase,A,Bp,rr*.7);G.tBase.material.opacity=.7*po;G.tBase.visible=po>.01;
  setTube(G.tPath,L,end,rr*1.25);G.tPath.material.opacity=fo;G.tPath.visible=fo>.01&&w>.5;
  setTube(G.tFront,E,end,rr*.55);G.tFront.material.opacity=.55*fo;G.tFront.visible=fo>.01;
  setTube(G.rayA,A,A.clone().addScaledVector(sv,Math.max(260,P.B*1.5)),rr*.35);setTube(G.rayB,Bp,Bp.clone().addScaledVector(sv,Math.max(260,P.B*1.5)),rr*.35);
  G.rayA.material.opacity=G.rayB.material.opacity=.3*fo;G.rayA.visible=G.rayB.visible=fo>.01;
  var rs=Math.max(1,camera.position.distanceTo(mid)/420);
  G.ringA.position.set(A.x,.4,A.z);G.ringB.position.set(Bp.x,.4,Bp.z);G.ringA.scale.setScalar(rs);G.ringB.scale.setScalar(rs);G.ringA.visible=G.ringB.visible=po>.5;
  // wavefronts
  var sp=Math.max(70,1.3*w),span=6*sp,lo=-(w/2+45),hi=lo+span,rad=Math.max(230,P.B*.95),speed=span/9;G.speed=speed;
  frontPhase=(frontPhase+dt*speed)%span;var fa=0,fb=0,pa=A.clone().sub(mid).dot(sv),pb=Bp.clone().sub(mid).dot(sv),sig=sp*.07;
  qd.setFromUnitVectors(new T.Vector3(0,0,1),sv);
  for(i=0;i<6;i++){var d=hi-((frontPhase+i*sp)%span),f=G.fronts[i];f.position.copy(mid).addScaledVector(sv,d);f.quaternion.copy(qd);f.scale.setScalar(rad);
    var fade=clamp((hi-d)/(span*.18),0,1)*clamp((d-lo)/(span*.12),0,1);f.material.opacity=.2*fo*fade;f.visible=fo>.01;
    fa+=Math.exp(-((d-pa)/sig)*((d-pa)/sig));fb+=Math.exp(-((d-pb)/sig)*((d-pb)/sig));}
  pulseA[pulseN]=Math.min(1,fa);pulseB[pulseN]=Math.min(1,fb);pulseN=(pulseN+1)%300;
  var fs=camera.position.distanceTo(mid)*.03;
  G.flashA.position.copy(A);G.flashB.position.copy(Bp);G.flashA.scale.setScalar(fs*(1+2.2*fa));G.flashB.scale.setScalar(fs*(1+2.2*fb));
  G.flashA.material.opacity=po*(.35+.65*Math.min(1,fa)*fo);G.flashB.material.opacity=po*(.35+.65*Math.min(1,fb)*fo);
  // sky patch
  var l=G.pole.clone().cross(sv).normalize(),mN=sv.clone().cross(l);
  m4.makeBasis(l.clone().negate(),mN,sv.clone().negate());m4.setPosition(sv.clone().multiplyScalar(PATCH_R));
  G.patch.matrix.copy(m4);G.patchFrame.matrix.copy(m4);G.patch.material.opacity=.96*G.op.patch;G.patchFrame.material.opacity=.6*G.op.patch;G.patch.visible=G.patchFrame.visible=G.op.patch>.01;
  if(imgTexDirty){G.patchTex.needsUpdate=true;imgTexDirty=false;}
  // source arc
  if(G.op.arc>.01){var ap=G.arcGeo.attributes.position.array,n=0;for(i=0;i<200;i++){var hh=-6.5+13*i/199,q=srcENU(hh,S.decCur);if(q[2]<Math.sin(ELMIN))continue;ap[n++]=q[0]*RS;ap[n++]=q[2]*RS;ap[n++]=-q[1]*RS;}
    G.arcGeo.setDrawRange(0,n/3);G.arcGeo.attributes.position.needsUpdate=true;}
  G.arc.material.opacity=.55*G.op.arc;G.arc.visible=G.op.arc>.01;
  // camera
  if(G.tween){G.tween.t=Math.min(1,G.tween.t+dt/1.9);var e=G.tween.t,k=e<.5?4*e*e*e:1-Math.pow(-2*e+2,3)/2;camera.position.lerpVectors(G.tween.p0,G.tween.p1,k);controls.target.lerpVectors(G.tween.t0,G.tween.t1,k);if(e>=1)G.tween=null;}
  controls.autoRotate=c===0&&!G.touched&&!reduced&&!G.tween;controls.update();if(camera.position.y<3)camera.position.y=3;
  // labels
  var up=new T.Vector3(0,13,0);
  place(G.lA,A.clone().add(up),nameOf(S.pair[0]),po>.5);place(G.lB,Bp.clone().add(up),nameOf(S.pair[1]),po>.5);
  place(G.lD,L.clone().addScaledVector(sv,w*.5),'+'+w.toFixed(1)+' m · '+(w/C*1e9).toFixed(0)+' ns',fo>.5&&w>.5);
  place(G.lS,G.src.position.clone().add(new T.Vector3(0,sd*.035,0)),'radio source, δ '+S.decCur.toFixed(0)+'°',true);
  place(G.lP,sv.clone().multiplyScalar(PATCH_R).addScaledVector(mN,PATCH_S*.56),c===4?'the fringe of this pair on the sky':c===7?'what the array has measured':'the image',G.op.patch>.5);
  gl.render(scene,camera);
}

/* ---------- main loop ---------- */
var last=performance.now(),frame=0;
function tick(now){
  requestAnimationFrame(tick);var dt=Math.min(.05,(now-last)/1000);last=now;frame++;
  if(S.playing){S.playT=Math.min(1,S.playT+dt/9);need.sample=true;if(S.playT>=1)S.playing=false;}
  var hl=hourList(),Ht=hl[hl.length-1],kk=reduced?1:Math.min(1,dt*3.5);
  S.Hcur+=(Ht-S.Hcur)*kk;S.decCur+=(S.dec-S.decCur)*kk;if(Math.abs(Ht-S.Hcur)<1e-4)S.Hcur=Ht;if(Math.abs(S.dec-S.decCur)<1e-3)S.decCur=S.dec;
  pairUpdate();
  if(need.sample&&S.ch>=5){sampleUV();need.sample=false;need.image=true;need.panel=need.read=true;}
  if(need.image&&S.ch>=7){computeImages();cleanReset();need.image=false;need.panel=need.read=true;}
  if(S.ch===8&&S.cleanRun){cleanStep(40);need.panel=need.read=true;if(cl.done)S.cleanRun=false;}
  if(S.ch===2||S.ch===3)runCorr(dt);
  sizePanel();
  var k=CH[S.ch].panel,anim=k==='timeline'||k==='scope'||k==='corr'||(k==='fringe'&&(frame%4===0));
  if(need.panel||anim){drawPanel();need.panel=false;}
  if(need.read||frame%12===0){readouts();need.read=false;}
  if(ok)update3D(dt,now/1000);
}
if(ok){try{init3D();}catch(err){ok=false;$('nogl').hidden=false;canvas.hidden=true;if(window.console)console.error(err);}}
renderChapter();pairUpdate();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){need.panel=true;});
requestAnimationFrame(tick);
})();
</script>
