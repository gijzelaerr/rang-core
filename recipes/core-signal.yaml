# Core-native signal track: Rust core and Rust component predictor, no
# Measurement Set, no solver subprocess. Sits beside the frozen
# recipes/tv-flagging-signal-guard.yaml and never replaces it
# (research/core-h-recipes.md, research/core-phase3c-b.md).
_include: core-cabs.yaml
opts:
  backend: {select: native}
  log: {nest: 1}

cabs:
  rang-core-signal:
    flavour: python
    command: rangtoy.core_cli.signal
    inputs:
      run_dir: {dtype: str, required: true}
      inputs_dir: {dtype: Directory, required: true}
      uvw_dir: {dtype: Directory, required: true}
      iterations: {dtype: int, default: 50}

core-signal:
  info: Signal-guard track on the Rust core; two seeds, frozen TRAIN guards, paired injected-sky arms, 9 solves, compared with the archive by the phase 3 comparator.
  inputs:
    run-dir: {dtype: str, required: true}
    inputs-dir: {dtype: Directory, required: true, info: "The campaign inputs with cases/time-burst-seed107 and -seed109; read only."}
    uvw-dir: {dtype: Directory, required: true, info: The once-only UVW export with <case>/arrays.npz; read only.}
    archive: {dtype: File, default: research/results/gain-tv-next-signal.json}
    iterations: {dtype: int, default: 50}
  outputs:
    results: {dtype: File, implicit: '{recipe.run-dir}/result.json', path_policies: {mkdir_parent: false}}
    side-effects: {dtype: File, implicit: '{recipe.run-dir}/side-effects.json', path_policies: {mkdir_parent: false}}
    environment: {dtype: File, implicit: '{recipe.run-dir}/environment.json', path_policies: {mkdir_parent: false}}
    comparison: {dtype: File, implicit: '{recipe.run-dir}/compare-archive.json', path_policies: {mkdir_parent: false}}
  steps:
    measure:
      cab: rang-core-signal
      params:
        run_dir: =recipe.run-dir
        inputs_dir: =recipe.inputs-dir
        uvw_dir: =recipe.uvw-dir
        iterations: =recipe.iterations
    environment:
      cab: rang-core-environment
      params:
        run_dir: =recipe.run-dir
    compare:
      cab: rang-core-compare
      params:
        stage: signal
        result: '{recipe.run-dir}/result.json'
        oracle: =recipe.archive
        receipt: '{recipe.run-dir}/compare-archive.json'
DEFAULT: core-signal
