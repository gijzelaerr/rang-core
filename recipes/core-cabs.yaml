# Cabs shared by the core-native recipes (research/core-h-recipes.md).
# Python-flavour cabs on the native backend; the interpreter is the `python`
# on PATH, which must be the venv with rangtoy and stimela and no solver subprocess.
cabs:
  rang-core-environment:
    info: Record the interpreter and whether the frozen solver package is installed, importable or on PATH.
    flavour: python
    command: rangtoy.core_cli.environment
    inputs:
      run_dir: {dtype: Directory, required: true}
  rang-core-compare:
    info: Run the phase 3 comparator of a stage unchanged and record its SHA256; fails the recipe on any difference.
    flavour: python
    command: rangtoy.core_cli.compare
    inputs:
      stage: {dtype: str, required: true, choices: [injections, actions, trend, prospective, signal]}
      result: {dtype: File, required: true}
      oracle: {dtype: File, required: true}
      receipt: {dtype: str, required: true}
      posthoc_slope_scale: {dtype: bool, default: false}
