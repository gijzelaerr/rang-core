# Tests on every pull request (owner, 2026-11-11): what a contributor's branch
# must pass before the owner merges it. It runs the parts of the full local
# check (python -m rang.check) that need no archives or oracles outside the
# repository: ruff and ruff format, cargo fmt, clippy and cargo test for the
# root crate and core/, and pytest on Linux and Windows against the extension
# built from the branch. The archive gates (RANG_ARCHIVE_OUTPUTS) and the
# oracle tests that need CASA, QuartiCal or WSClean stay in the local check;
# tests that need them skip here. wheels.yml still builds and tests the five
# wheels when packaging or Rust files change.
#
# Pushes to any branch but main run it too (owner, 2026-11-13,
# research/speedup-tools.md): an agent pushes its branch and reads the result
# instead of running the full check locally on the shared host. The
# concurrency group is the branch name, so a push to a branch with an open
# pull request and the pull request's own run share one group: the later run
# cancels the earlier, and one run tests each state. Free on this public
# repository (standard GitHub-hosted runners).
name: tests

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.93.1"
  MATURIN_VERSION: "1.16.0"
  RUFF_VERSION: "0.17.3"
  PIP_INDEX_URL: https://pypi.org/simple
  OPENBLAS_NUM_THREADS: "1"
  RAYON_NUM_THREADS: "2"
  PYTHONUTF8: "1"

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
          echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"
      - name: ruff and ruff format
        run: |
          python -m pip install -q "ruff==$RUFF_VERSION"
          ruff check python examples tests
          ruff format --check python examples tests
      - name: cargo fmt
        run: |
          cargo fmt --check
          cargo fmt --check --manifest-path core/Cargo.toml

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            core/target
          key: tests-rust-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'core/Cargo.lock') }}
          restore-keys: tests-rust-${{ env.RUST_VERSION }}-
      - name: clippy (warnings are errors)
        run: |
          cargo clippy --locked --all-targets -q -- -D warnings
          cargo clippy --locked --all-targets -q --manifest-path core/Cargo.toml -- -D warnings
      - name: cargo test
        run: |
          cargo test --locked --release -q
          cargo test --locked --release -q --manifest-path core/Cargo.toml

  pytest:
    name: pytest ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/py/target
          key: tests-py-${{ matrix.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'core/Cargo.lock', 'core/py/Cargo.lock') }}
          restore-keys: tests-py-${{ matrix.os }}-${{ env.RUST_VERSION }}-
      - name: Build the extension into a venv
        run: |
          python -m venv .venv
          if [ -x .venv/Scripts/python.exe ]; then py=.venv/Scripts/python.exe; else py=.venv/bin/python; fi
          echo "PY=$PWD/$py" >> "$GITHUB_ENV"
          "$py" -m pip install -q "maturin==$MATURIN_VERSION"
          VIRTUAL_ENV=$PWD/.venv "$py" -m maturin develop --release --locked \
            --extras test,imaging,formats,casacure,pointing,beam,mcp,msv4
          "$py" -c "import rang.core as c; print('backend', c.backend_name())"
      # A one-node Slurm cluster, so tests/test_spool_launch.py submits real
      # spool workers with sbatch --array (research/multinode-2.md 1.3). The
      # runner is a VM with systemd, where Ubuntu's Slurm 23.11 runs as is.
      - name: Slurm (one node)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq slurmd slurmctld munge >/dev/null
          host=$(hostname -s)
          mem=$(( $(free -m | awk '/^Mem:/ {print $2}') - 2048 ))
          sudo mkdir -p /var/spool/slurmctld /var/spool/slurmd
          sudo chown slurm:slurm /var/spool/slurmctld
          cat <<EOF | sudo tee /etc/slurm/slurm.conf >/dev/null
          ClusterName=ci
          SlurmctldHost=$host
          SlurmUser=slurm
          AuthType=auth/munge
          ProctrackType=proctrack/linuxproc
          TaskPlugin=task/none
          SelectType=select/cons_tres
          SelectTypeParameters=CR_Core_Memory
          StateSaveLocation=/var/spool/slurmctld
          SlurmdSpoolDir=/var/spool/slurmd
          ReturnToService=2
          MpiDefault=none
          NodeName=$host CPUs=$(nproc) RealMemory=$mem State=UNKNOWN
          PartitionName=ci Nodes=ALL Default=YES MaxTime=INFINITE State=UP
          EOF
          sudo systemctl restart munge slurmctld slurmd
          for _ in $(seq 30); do sinfo -h -o %T | grep -q idle && break; sleep 2; done
          sinfo
          # A cluster that did not come up fails here, not as a skipped test.
          sinfo -h -o %T | grep -q idle
      - name: pytest
        run: |
          "$PY" -m pytest -q -ra
