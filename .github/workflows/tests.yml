# Tests on every pull request (owner, 2026-11-11): what a contributor's branch
# must pass before the owner merges it. It runs the parts of the full local
# check (python -m rang.check) that need no archives or oracles outside the
# repository: ruff and ruff format, cargo fmt, clippy and cargo test for the
# root crate and core/, and pytest on Linux and Windows against the extension
# built from the branch. The archive gates (RANG_ARCHIVE_OUTPUTS) and the
# oracle tests that need CASA, QuartiCal or WSClean stay in the local check;
# tests that need them skip here. wheels.yml still builds and tests the five
# wheels when packaging or Rust files change.
name: tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.93.1"
  MATURIN_VERSION: "1.16.0"
  RUFF_VERSION: "0.17.3"
  PIP_INDEX_URL: https://pypi.org/simple
  OPENBLAS_NUM_THREADS: "1"
  RAYON_NUM_THREADS: "2"
  PYTHONUTF8: "1"

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
          echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"
      - name: ruff and ruff format
        run: |
          python -m pip install -q "ruff==$RUFF_VERSION"
          ruff check python examples tests
          ruff format --check python examples tests
      - name: cargo fmt
        run: |
          cargo fmt --check
          cargo fmt --check --manifest-path core/Cargo.toml

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            core/target
          key: tests-rust-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'core/Cargo.lock') }}
          restore-keys: tests-rust-${{ env.RUST_VERSION }}-
      - name: clippy (warnings are errors)
        run: |
          cargo clippy --locked --all-targets -q -- -D warnings
          cargo clippy --locked --all-targets -q --manifest-path core/Cargo.toml -- -D warnings
      - name: cargo test
        run: |
          cargo test --locked --release -q
          cargo test --locked --release -q --manifest-path core/Cargo.toml

  pytest:
    name: pytest ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/py/target
          key: tests-py-${{ matrix.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'core/Cargo.lock', 'core/py/Cargo.lock') }}
          restore-keys: tests-py-${{ matrix.os }}-${{ env.RUST_VERSION }}-
      - name: Build the extension into a venv
        run: |
          python -m venv .venv
          if [ -x .venv/Scripts/python.exe ]; then py=.venv/Scripts/python.exe; else py=.venv/bin/python; fi
          echo "PY=$PWD/$py" >> "$GITHUB_ENV"
          "$py" -m pip install -q "maturin==$MATURIN_VERSION"
          VIRTUAL_ENV=$PWD/.venv "$py" -m maturin develop --release --locked \
            --extras test,imaging,formats,casacure,pointing,beam
          "$py" -c "import rang.core as c; print('backend', c.backend_name())"
      - name: pytest
        run: |
          "$PY" -m pytest -q -ra
