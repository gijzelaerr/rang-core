# Distributable rang-core wheels (research/wheel.md, big-plan task W1; the
# macOS and Windows matrix and the PyPI job are task X1,
# research/x1-crossplatform.md).
#
# Builds abi3-py310 wheels with maturin for manylinux_2_28 x86_64 and
# aarch64, macOS arm64 and x86_64, and Windows x86_64 (each with the target's
# baseline CPU), plus the sdist; tests every installed wheel on CPython 3.10
# and 3.14 on its own OS with cargo absent from PATH (import, extension
# backend chosen, one fused pass, tests/test_core_backends.py against a C ABI
# built from the same commit) through tools/wheel/test.py; uploads
# everything as artifacts; on a v* tag attaches the files to a GitHub release
# and publishes them to PyPI by trusted publishing (environment `pypi`, which
# needs the pending publisher registered on pypi.org first).
name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/wheels.yml"
      - "tools/wheel/**"
      - "pyproject.toml"
      - "core/**"
      - "src/**"
      - "Cargo.*"
      - ".cargo/**"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # bash -eo pipefail on every OS (Git Bash on the Windows runners).
    shell: bash

env:
  # The toolchain of tools/check-all.sh and tools/wheel/build.sh.
  RUST_VERSION: "1.93.1"
  MATURIN_VERSION: "v1.16.0"

jobs:
  wheel:
    name: wheel ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64
            manylinux: "2_28"
            cpu: x86-64
          - platform: linux-aarch64
            runner: ubuntu-24.04
            target: aarch64
            manylinux: "2_28"
            cpu: generic
          # One native job per macOS architecture, not universal2: RUSTFLAGS
          # carries target-cpu, which cannot be right for both halves of a
          # fat binary, and each wheel is then tested on its own hardware.
          - platform: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            manylinux: "off"
            cpu: apple-m1
          # macos-13 was retired in December 2025; macos-15-intel is GitHub's
          # Intel replacement (until the macOS 15 image retires, autumn 2027).
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: "off"
            cpu: x86-64
          - platform: windows-x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            manylinux: "off"
            cpu: x86-64
    env:
      # Baseline ISA for distributable binaries: overrides any
      # .cargo/config.toml rustflags (local x86_64 builds use x86-64-v3).
      # maturin-action passes RUSTFLAGS into its build container on Linux.
      RUSTFLAGS: "-C target-cpu=${{ matrix.cpu }}"
    steps:
      # LF endings on Windows too: the wheel packs the .py files as checked
      # out, and receipts hash them (Git for Windows defaults to autocrlf).
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          maturin-version: ${{ env.MATURIN_VERSION }}
          rust-toolchain: ${{ env.RUST_VERSION }}
          args: --release --locked --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          maturin-version: ${{ env.MATURIN_VERSION }}
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  test:
    name: test ${{ matrix.platform }} py${{ matrix.python }}
    needs: wheel
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
        platform: [linux-x86_64, linux-aarch64, macos-arm64, macos-x86_64, windows-x86_64]
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-14
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: windows-x86_64
            runner: windows-2022
    steps:
      # LF endings on Windows too, so every runner tests the same bytes (Git
      # for Windows defaults to core.autocrlf=true).
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: dist
      # tools/wheel/test.py: a fresh venv, the wheel with its test and imaging
      # extras from public PyPI, then import, tools/wheel/smoke.py and
      # tests/test_core_backends.py (against its archive), test_toy.py,
      # test_p7_architecture.py and test_p12_rename.py (tools/wheel/pytest_wheel.py) with every
      # PATH directory that holds cargo removed (asserted) and no RANG_*
      # variables; any skip other than the missing MS oracle fails the step.
      - name: Install and test the wheel with cargo absent
        env:
          PIP_INDEX_URL: https://pypi.org/simple
          PYTHONUTF8: "1"
        run: |
          wheel=$(ls dist/*.whl)
          python tools/wheel/test.py "$wheel" "$RUNNER_TEMP/wheel-test" \
            --python "${{ steps.python.outputs.python-path }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.platform }}-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/wheel-test/*.log
            ${{ runner.temp }}/wheel-test/timings.tsv
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheel, sdist, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Attach the wheels and sdist to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          (cd dist && sha256sum ./* > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$GITHUB_REF_NAME" --notes "Wheels and sdist built by the wheels workflow."

  # PyPI by trusted publishing, no token. The pending publisher is registered
  # on pypi.org for the project rang-core (pyproject.toml [project] name):
  # owner gijzelaerr, repository rang-core, workflow wheels.yml, environment
  # pypi. A v* tag (the user tags, e.g. v0.1.0) publishes rang-core.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheel, sdist, test]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      # A fresh download, so the release job's SHA256SUMS is not uploaded.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
