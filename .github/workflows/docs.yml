# The documentation site (big plan task D1, research/d1-docs.md).
#
# Builds the extension as wheels.yml does (Rust 1.93.1, maturin 1.16.0, here
# `maturin develop --release` into a venv), downloads the public tutorial
# fixture through rang.notebook.data.download_fixture (SHA256 verified),
# executes the notebooks (tutorials, science and the introductory track I1-I9;
# 00, task E4, and the A1-based intro notebooks write their own simulated MS)
# with papermill on the fixture alone
# (RANG_NOTEBOOK_LUNO=0; without CARACAL's strategy YAMLs the comparator
# sections use the teaching strategy), checks the CLI page against
# `rang-core -h`, and builds the site with Sphinx, failing on any warning.
# The intro notebooks I6-I8 (calibration, imaging, polarisation) run nightly
# only (V3's owner decision 3, research/v3-intro-track.md): the nightly build
# executes them and caches the executed copies, and every other build restores
# the latest copies and renders them while their code is unchanged
# (docs/execute_notebooks.py). Every push and pull request uploads the site as
# the `github-pages` artifact; pushes to main and the nightly build deploy it
# to GitHub Pages
# (https://pythonic.nl/rang-core/; Pages source "GitHub Actions"). The build job
# is the gate: on a repository without Pages (a fork, say), the deploy job warns
# and succeeds without deploying (research/w4-8-readme-docs.md).
name: docs

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"  # nightly: also runs intro notebooks I6-I8

permissions:
  contents: read

# A newer push cancels an older build, except on main, where a running
# deployment must finish.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The toolchain of tools/check-all.sh and wheels.yml.
  RUST_VERSION: "1.93.1"
  MATURIN_VERSION: "1.16.0"
  PYTHON_VERSION: "3.14"
  PIP_INDEX_URL: https://pypi.org/simple
  OPENBLAS_NUM_THREADS: "1"
  RAYON_NUM_THREADS: "4"
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/py/target
          key: docs-cargo-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'core/Cargo.lock', 'core/py/Cargo.lock') }}
          restore-keys: docs-cargo-${{ env.RUST_VERSION }}-
      - name: Build the extension and install the docs extras
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install "maturin==$MATURIN_VERSION"
          VIRTUAL_ENV=$PWD/.venv .venv/bin/maturin develop --release --locked \
            --extras docs,notebook,imaging,pointing,beam
          .venv/bin/python -c "import rang.core as c; print('backend', c.backend_name())"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/rang-fixture
          key: rang-fixture-d4dae56f7ad1bb4a49ab8c4a3846871d5b8ebb4b731ee958cb9f1baf3306144f
      - name: Download and verify the fixture
        run: |
          python -c "from rang.notebook.data import download_fixture as d; print(d('$HOME/.cache/rang-fixture'))"
      # The executed I6-I8 of the latest nightly build (any branch reads main's).
      - uses: actions/cache/restore@v6
        with:
          path: |
            docs/tutorials/notebooks/i6-calibration.ipynb
            docs/tutorials/notebooks/i7-imaging-and-deconvolution.ipynb
            docs/tutorials/notebooks/i8-polarisation.ipynb
          key: intro-nightly-${{ github.run_id }}
          restore-keys: intro-nightly-
      - name: Execute the notebooks
        env:
          RANG_NOTEBOOK_LUNO: "0"
          RANG_NOTEBOOK_INTRO_SLOW: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
        run: |
          export RANG_FIXTURE="$HOME/.cache/rang-fixture/outer_scans.zip"
          export RANG_NOTEBOOK_CACHE="$RUNNER_TEMP/rang-notebook"
          python docs/execute_notebooks.py --timing "$RUNNER_TEMP/notebook-times.json"
      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/save@v6
        with:
          path: |
            docs/tutorials/notebooks/i6-calibration.ipynb
            docs/tutorials/notebooks/i7-imaging-and-deconvolution.ipynb
            docs/tutorials/notebooks/i8-polarisation.ipynb
          key: intro-nightly-${{ github.run_id }}
      - name: Check the CLI page against rang-core -h
        run: python docs/gen_cli.py --check
      - name: Build the site (warnings are errors)
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Check that GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          case "$status" in
            200)
              echo 'enabled=true' >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "::warning::GitHub Pages is not enabled for this repository: enable it under Settings > Pages > Source: GitHub Actions, or run: gh api -X POST repos/$GITHUB_REPOSITORY/pages -f build_type=workflow"
              echo 'enabled=false' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::GET /repos/$GITHUB_REPOSITORY/pages returned $status"
              exit 1
              ;;
          esac
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v6
      - if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
